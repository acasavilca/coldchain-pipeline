version: 2

sources:
  - name: coldchain_raw
    database: fruit-packing-plant-simulator
    schema: "{{ var('raw_dataset', 'coldchain_raw') }}"
    tables:
      - name: telemetry
        description: "Long-format tag/timestamp/value telemetry from refrigeration cycle + room sensors."
        columns:
          - name: timestamp_ms
            data_tests: [not_null]
          - name: tag_name
            data_tests: [not_null]

      - name: batch_sensors
        description: "Long-format tag/timestamp/value sensors mounted on pallets (pulp temp probe, load cell)."
        columns:
          - name: timestamp_ms
            data_tests: [not_null]
          - name: batch_id
            data_tests: [not_null]

      - name: compressor_events
      - name: humidifier_events
      - name: door_events
      - name: crop_rotation_events
      - name: refrigerant_rotation_events
      - name: downtime_sequence_events
      - name: lp_trip_events
        description: "Low-pressure switch trip/reset events from the refrigeration controller."
      - name: defrost_events
        description: "Electric defrost controller state changes: one row each time the controller enters a phase, with the termination reason on the heat-to-drip row."

      # order_id and batch_id are per-room counters, so they repeat across locations: the key is (location_id, id)
      - name: inbound_orders
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [location_id, order_id]
        columns:
          - name: location_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]

      - name: outbound_orders
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [location_id, order_id]
        columns:
          - name: location_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]

      - name: inbound_pallet_history
        columns:
          - name: batch_id
            data_tests: [not_null]
          # parent_order_id -> order_id is checked per location in tests/assert_inbound_pallet_parent_order_exists.sql

      - name: outbound_pallet_history
        columns:
          - name: batch_id
            tests: [not_null]
          # parent_order_id -> order_id is checked per location in tests/assert_outbound_pallet_parent_order_exists.sql

      - name: weather_data
